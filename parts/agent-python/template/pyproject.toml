[project]
name = "{{ name }}"
version = "0.1.0"
{% if description %}
description = "{{ description | toml_escape }}"
{% endif %}
{% if author and email %}
authors = [{ name = "{{ author | toml_escape }}", email = "{{ email | toml_escape }}" }]
{% elif author %}
authors = [{ name = "{{ author | toml_escape }}" }]
{% endif %}
readme = "README.md"
requires-python = ">={{ python_version }}"
dependencies = [
    "zelos-sdk>=0.0.13a1",
]

{% if repository %}
[project.urls]
Homepage = "{{ repository }}"
Repository = "{{ repository }}"
Issues = "{{ repository }}/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"
{% endif %}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["{{ project_slug }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py{{ python_version | replace(".", "") }}'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
