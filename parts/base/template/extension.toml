name = "{{ name | replace('-', ' ') | title }}"
version = "0.1.0"
{% if description %}
description = "{{ description | toml_escape }}"
{% endif %}
{% if author %}
author = "{{ author | toml_escape }}"
{% endif %}
{% if repository %}
repository = "{{ repository }}"
{% endif %}
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = []
categories = []
icon = "assets/icon.svg"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[package]
paths = ["LICENSE"]
