version: 2
updates:
{% if with_agent %}
  # Agent runtime: pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"

{% endif %}
{% if with_tab or with_panel %}
  # Web project: web/package.json and web/package-lock.json
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"

{% endif %}
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"
