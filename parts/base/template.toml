[template]
part = "base"
description = "Manifest, README, license, Justfile and GitHub workflows shared by every project"

[[template.variables]]
name = "name"
pattern = "[a-z][a-z0-9]*(-[a-z0-9]+)*"

[[template.variables]]
name = "description"
default = ""

[[template.variables]]
name = "author"
default = ""

[[template.variables]]
name = "email"
default = ""

[[template.variables]]
name = "github"
default = ""

[template.substitution]
include = [
  "extension.toml",
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE",
  ".github/dependabot.yml",
]
